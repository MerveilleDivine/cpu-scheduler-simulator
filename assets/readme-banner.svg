<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CPU Scheduler Simulator</title>
  <desc id="desc">Black and white banner showing a CPU scheduling timeline.</desc>
  <rect width="1200" height="300" rx="24" fill="#090909"/>
  <path d="M0 252H1200M0 48H1200" stroke="#262626"/>
  <text x="64" y="78" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">C++ · OPERATING SYSTEMS</text>
  <text x="62" y="142" fill="#FAFAFA" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">CPU Scheduler Simulator</text>
  <text x="64" y="184" fill="#BDBDBD" font-family="Inter, Arial, sans-serif" font-size="18">Compare CPU scheduling with process metrics and an execution timeline.</text>
  <g transform="translate(64 218)">
    <rect width="176" height="34" fill="#FAFAFA"/>
    <rect x="182" width="138" height="34" fill="#D4D4D4"/>
    <rect x="326" width="108" height="34" fill="#A3A3A3"/>
    <rect x="440" width="150" height="34" fill="#737373"/>
    <rect x="596" width="120" height="34" fill="#404040"/>
    <g fill="#090909" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
      <text x="88" y="22">P1</text><text x="251" y="22">P2</text><text x="380" y="22">P3</text>
    </g>
    <g fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
      <text x="515" y="22">P4</text><text x="656" y="22">P5</text>
    </g>
  </g>
  <text x="1136" y="240" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">FCFS · SJF · SRTF · PRIORITY · RR</text>
</svg>
